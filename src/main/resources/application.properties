spring.application.name=skatemaps

# ===============================
# DATABASE CONNECTION
# ===============================
# Points to local server, port 3306, and the skatemaps database
spring.datasource.url=jdbc:mysql://localhost:3306/skatemaps?useSSL=false&serverTimezone=UTC

# MySQL credentials
spring.datasource.username=root
spring.datasource.password=Mballsl1!

# The driver that translates Java to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# Auto-creates/updates tables based on Java code
spring.jpa.hibernate.ddl-auto=update

# Prints the SQL queries in IDE console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Spring which version of SQL to write
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect